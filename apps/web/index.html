    <style>
      html:has(.startup-shell),
      body:has(.startup-shell) {
        background-color: #101114;
        color-scheme: only dark;
        overscroll-behavior: none;
      }

      .startup-shell {
        align-content: center;
        background: #101114;
        box-sizing: border-box;
        color: #c4cdd6;
        display: grid;
        font: 400 14px/1.5 system-ui, sans-serif;
        justify-items: center;
        margin: 0;
        padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
        padding-inline: max(24px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-right, 0px));
        position: fixed;
        inset: 0;
        text-align: center;
      }

      .startup-icon {
        display: block;
        height: 84px;
        width: 84px;
      }

      .startup-detail {
        inset: calc(50% + 58px) 24px auto;
        position: absolute;
      }

      .startup-status {
        margin: 0;
      }

      .startup-retry {
        color: #f3f0e8;
        display: inline-block;
        margin-top: 10px;
        padding: 8px;
        text-underline-offset: 3px;
        visibility: hidden;
        animation: startup-show-retry 10s step-end forwards;
      }

      @keyframes startup-show-retry {
        to { visibility: visible; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-shell" aria-label="Moondi">
        <img alt="" class="startup-icon" fetchpriority="high" height="84" src="/icon-512.png" width="84" />
        <div class="startup-detail">
          <noscript><p>เปิด JavaScript เพื่อใช้งาน Moondi · Enable JavaScript to use Moondi.</p></noscript>
          <a class="startup-retry" href="">โหลดใหม่ · Reload</a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
